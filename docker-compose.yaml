# Example Compose file for deploying Sagashi with the published image.
#
# Usage:
#   cp example.env .env   # fill in the required credentials
#   cp cookies.txt.example cookies.txt  # or export your own cookies.txt
#   docker compose up -d
#
# Mirrors the production deployment in hako (services/agent/sagashi):
# published image, fixed container name, health check via /healthz.

services:
  sagashi:
    image: ghcr.io/divin/sagashi:latest
    container_name: sagashi
    restart: unless-stopped
    environment:
      URUKY_TOKEN: ${URUKY_TOKEN:?Set URUKY_TOKEN in .env}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:?Set REDDIT_CLIENT_ID in .env}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:?Set REDDIT_CLIENT_SECRET in .env}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:?Set REDDIT_USER_AGENT in .env}
      # Optional: set to require a bearer token on MCP endpoints.
      MCP_SEARCH_AUTH_TOKEN: ${MCP_SEARCH_AUTH_TOKEN:-}
      FETCH_MAX_CHARS: ${FETCH_MAX_CHARS:-40000}
      # Path to the cookies.txt inside the container (see volumes below).
      YOUTUBE_COOKIES_FILE: /app/cookies.txt
      TZ: Europe/Berlin
    volumes:
      # YouTube bot-checks the server's IP, so yt-dlp needs a cookies.txt
      # (Netscape format) exported while signed in to YouTube. Export it
      # once with a browser extension (e.g. "Get cookies.txt LOCALLY").
      # MUST be read-write: yt-dlp rewrites the file after every run to
      # persist YouTube's rotating session cookies — a read-only mount
      # crashes yt-dlp on exit.
      - ./cookies.txt:/app/cookies.txt:rw
    ports:
      - "${SAGASHI_PORT:-9092}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Shared network for other agent services. Remove this block
    # (and the networks: section below) for a standalone deployment.
    networks:
      - agents

networks:
  agents:
    name: agents
    external: true
